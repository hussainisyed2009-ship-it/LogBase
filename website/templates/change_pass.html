{% extends "base.html" %} {% block title %}Set New Password — LogBase{% endblock %}

{% block content %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .auth-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--r-xxxl);
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: rgba(5, 0, 56, 0.18) 0px 16px 48px -8px;
  }

  .auth-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .auth-logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--morgan-blue);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: var(--r-full);
    letter-spacing: -0.2px;
  }

  .auth-title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
    margin: 0 0 6px 0;
  }

  .auth-subtitle {
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
    margin: 0 0 28px 0;
    line-height: 1.5;
  }

  .field-group {
    margin-bottom: 16px;
  }

  .field-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .auth-input {
    width: 100%;
    height: 44px;
    padding: 10px 14px;
    border-radius: var(--r-md);
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    border: 1px solid var(--card-border);
    outline: none;
    font-size: 15px;
    font-family: var(--font);
    box-sizing: border-box;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .auth-input:focus {
    border-color: var(--morgan-blue);
    box-shadow: 0 0 0 3px var(--morgan-blue-light);
  }

  .auth-input::placeholder { color: var(--ink-muted); }

  .auth-btn {
    display: block;
    width: 100%;
    padding: 12px 24px;
    background: var(--morgan-blue);
    color: #ffffff;
    border: none;
    border-radius: var(--r-full);
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    margin-top: 24px;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    box-shadow: 0 4px 14px rgba(35, 64, 139, 0.4);
  }

  .auth-btn:hover {
    background: var(--morgan-blue-deep);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(35, 64, 139, 0.5);
  }

  .back-link-wrapper {
    text-align: center;
    margin-top: 18px;
  }

  .back-link {
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .back-link:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  .auth-tagline {
    text-align: center;
    margin-top: 28px;
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.6;
    padding-top: 20px;
    border-top: 1px solid var(--hairline);
  }

  .auth-tagline strong {
    color: rgba(255, 255, 255, 0.7);
  }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-badge">LogBase</span>
    </div>

    <form method="POST">
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">Choose a new secure password for your LogBase account.</p>

      <div class="field-group">
        <label for="password1">New Password</label>
        <input
          type="password"
          class="auth-input"
          id="password1"
          name="password1"
          placeholder="Enter new password"
          required
        >
      </div>

      <div class="field-group">
        <label for="password2">Confirm New Password</label>
        <input
          type="password"
          class="auth-input"
          id="password2"
          name="password2"
          placeholder="Confirm new password"
          required
        >
      </div>

      <button type="submit" class="auth-btn">Update Password</button>

      <div class="back-link-wrapper">
        <a href="{{ url_for('auth.login') }}" class="back-link">← Back to Sign In</a>
      </div>
    </form>

    <div class="auth-tagline">
      <strong>Every page counts.</strong><br>
      Every reader matters. Join the quest!
    </div>
  </div>
</div>
{% endblock %}
